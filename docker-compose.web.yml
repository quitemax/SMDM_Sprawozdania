# Nakładka Kroku 2 (webowy interfejs) na docker-compose.yml (Krok 1).
# Uruchomienie: docker compose -f docker-compose.yml -f docker-compose.web.yml up -d
# Krok 1 sam w sobie (docker compose up -d, bez tego pliku) dalej działa
# niezmieniony — to nakładka, nie zamiana.
#
# Wymaga w .env (obok docker-compose.yml): MYSQL_ROOT_PASSWORD, MYSQL_PASSWORD
# (patrz .env.example).

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: smdm
      MYSQL_USER: smdm
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql

  php-fpm:
    build: ./web/backend
    restart: unless-stopped
    depends_on:
      - mariadb
    environment:
      DATABASE_URL: mysql://smdm:${MYSQL_PASSWORD}@mariadb:3306/smdm?serverVersion=10.11.2-MariaDB&charset=utf8mb4
      SMDM_OUTPUT_DIR: /var/www/output
      APP_ENV: dev
    volumes:
      - ./web/backend:/app
      - ./output:/var/www/output
      # var/ (cache, logi) osobnym wolumenem — bind mount Windows/WSL2 jest
      # bardzo wolny przy wielu małych zapisach (cache Symfony w dev), co
      # bez tego potrafiło wydłużać pojedyncze zapytanie do >10s.
      - backend_var:/app/var

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - php-fpm
      - nuxt
    ports:
      - "8080:80"
    volumes:
      - ./web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/backend/public:/app/public:ro

  nuxt:
    build: ./web/frontend
    restart: unless-stopped
    volumes:
      - ./web/frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  mariadb_data:
  frontend_node_modules:
  backend_var:
