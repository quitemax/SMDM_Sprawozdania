# Konfiguracja projektu — ścieżki i domyślne parametry pipeline'u.
# Wartości tutaj to domyślne ustawienia skryptów; można je nadpisać
# parametrami linii poleceń (patrz docs/HOW_TO_USE.md).

paths:
  input_audio: input/audio
  output_transcripts: output/transcripts
  output_reports: output/reports
  input_knowledge: input/knowledge
  knowledge_md: input/knowledge_md
  historical_reports: input/historical_data/reports
  historical_reports_md: input/historical_data/reports_md

whisperx:
  model: large-v3
  language: pl
  batch_size: 16
  diarize: true

ollama:
  model: SpeakLeash/bielik-11b-v3.0-instruct:Q4_K_M
  # Adres serwera Ollama. Nadpisywalny zmienną środowiskową OLLAMA_HOST —
  # w Dockerze wskazuje na nazwę usługi w sieci compose (http://ollama:11434),
  # lokalnie zostaje domyślny localhost.
  host: http://localhost:11434
