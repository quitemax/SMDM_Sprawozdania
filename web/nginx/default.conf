# Pojedynczy punkt wejścia dla całej apki webowej: /api/* trafia do
# Symfony (przez php-fpm), wszystko inne do Nuxt. Dzięki temu przeglądarka
# widzi jedno origin — bez CORS w produkcyjnym użyciu (CORS w Symfony,
# nelmio_cors.yaml, zostaje jako wygoda przy pracy z `npm run dev` na
# osobnym porcie).
server {
    listen 80;
    root /app/public;

    client_max_body_size 200m; # nagrania audio wgrywane przez UI (Faza 2)

    location /api/ {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-fpm:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location / {
        proxy_pass http://nuxt:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
